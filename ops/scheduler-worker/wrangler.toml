name = "avela-reminder-scheduler"
main = "worker.js"
compatibility_date = "2026-01-01"

# Every five minutes. Cloudflare supports down to every minute on the free plan.
[triggers]
crons = ["*/5 * * * *"]

[vars]
AVELA_URL = "https://avela-taupe.vercel.app"

# Secrets are NOT stored here. Set them once:
#   npx wrangler secret put CRON_SECRET
#   npx wrangler secret put FAILURE_WEBHOOK_URL   (optional)
