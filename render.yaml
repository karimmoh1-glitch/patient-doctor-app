services:
  - type: web
    name: careconnect
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run db:push
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careconnect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: careconnect-db
    plan: free
