# The Neon safe-branch rehearsal (docs/RELEASE_PROCEDURE.md §1.3), run from GitHub's network because plain TCP to Neon is blocked from the owner's laptop.
# MANUAL ONLY. UNTESTED until the owner has stored the two secrets below and dispatched it once. It never touches production:
#   * it creates its own branch (a copy-on-write copy of the parent) and every database command uses THAT branch's connection string;
#   * before anything else it checks the branch is not the project's primary/default branch and has a different endpoint host than the parent;
#   * the branch is deleted at the end whatever happens.
# It prints counts, timings and verdicts only; every generated credential is masked.
#
# Owner setup (no secret is ever pasted into a chat; the values are read from your terminal):
#   gh secret set NEON_API_KEY      # Neon console > Account settings > API keys > create a key; paste when asked
#   gh variable set NEON_PROJECT_ID --body <the project id shown in the Neon console URL>
#   gh variable set NEON_PARENT_BRANCH --body <the name of the branch that holds production data, usually main or production>
# Then: gh workflow run neon-rehearsal.yml
name: Neon rehearsal (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PROJECT: ${{ vars.NEON_PROJECT_ID }}
      PARENT: ${{ vars.NEON_PARENT_BRANCH }}
      BRANCH: rehearse-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Refuse to run without the owner's configuration
        run: |
          for v in NEON_API_KEY PROJECT PARENT; do [ -n "${!v}" ] || { echo "::error::$v is not set (see the comment at the top of this file)"; exit 1; }; done

      - name: Create the branch (a copy of the parent; nothing is written to the parent)
        run: |
          npx neonctl branches create --name "$BRANCH" --parent "$PARENT" --project-id "$PROJECT" --output json > branch.json
          echo "branch id: $(jq -r '.branch.id' branch.json)"
      - name: Prove it is not the primary branch and does not share the parent's endpoint
        run: |
          primary=$(npx neonctl branches get "$BRANCH" --project-id "$PROJECT" --output json | jq -r '.default // .primary // false')
          [ "$primary" = "false" ] || { echo "::error::the rehearsal branch is the project's default branch; stopping"; exit 1; }
          parent_host=$(npx neonctl connection-string "$PARENT" --project-id "$PROJECT" | sed -E 's#.*@([^/:?]+).*#\1#')
          branch_host=$(npx neonctl connection-string "$BRANCH" --project-id "$PROJECT" | sed -E 's#.*@([^/:?]+).*#\1#')
          [ "$parent_host" != "$branch_host" ] || { echo "::error::branch and parent share an endpoint; stopping"; exit 1; }
          echo "branch endpoint differs from the parent's"

      - name: Connection strings (masked)
        run: |
          OWNER=$(npx neonctl connection-string "$BRANCH" --project-id "$PROJECT" --database-name neondb)
          echo "::add-mask::$OWNER"
          RUNTIME_PW=$(openssl rand -base64 36 | tr -d '\n=+/' | cut -c1-40)
          echo "::add-mask::$RUNTIME_PW"
          echo "OWNER_DATABASE_URL=$OWNER" >> "$GITHUB_ENV"
          echo "AVELA_RUNTIME_PASSWORD=$RUNTIME_PW" >> "$GITHUB_ENV"

      - name: Baseline - version, pooling, migrations, fingerprint
        run: |
          psql "$OWNER_DATABASE_URL" -qAt -c "select 'postgres ' || current_setting('server_version')" -c "select 'migrations ' || count(*) from schema_migrations"
          DATABASE_URL="$OWNER_DATABASE_URL" npm run -s schema:fingerprint | tee fp-before.txt | tail -1
          echo "expected fingerprint 5dc5a2698a1e (production before the release)"

      - name: Dry run 0024-0029 in one transaction (rolled back) - timed
        run: |
          /usr/bin/time -f "dry run wall time %es" env OWNER_DATABASE_URL="$OWNER_DATABASE_URL" npm run -s migration:dry-run 2>&1 | tail -8

      - name: Apply 0024-0029 for real on the branch - timed, with a lock watcher
        run: |
          ( while true; do psql "$OWNER_DATABASE_URL" -qAt -c "select count(*) from pg_locks where not granted" >> locks.txt 2>/dev/null; sleep 0.2; done ) &
          watcher=$!
          /usr/bin/time -f "migration wall time %es" env DATABASE_URL="$OWNER_DATABASE_URL" npm run -s db:migrate 2>&1 | tail -10
          kill $watcher || true
          echo "max waiting (ungranted) locks observed: $(sort -n locks.txt | tail -1)"
          DATABASE_URL="$OWNER_DATABASE_URL" npm run -s audit:db | tail -1

      - name: The runtime role, a fresh signing key, enforcement, and the unrestricted scope refused
        run: |
          DATABASE_URL="$OWNER_DATABASE_URL" npm run -s db:create-app-role | tail -2
          DATABASE_URL="$OWNER_DATABASE_URL" npm run -s identity:key -- generate --kid=rehearsal --out="$RUNNER_TEMP/identity.key" | tail -1
          echo "IDENTITY_KEY_ID=rehearsal" >> "$GITHUB_ENV"
          key=$(grep '^IDENTITY_KEY=' "$RUNNER_TEMP/identity.key" | cut -d= -f2-)
          echo "::add-mask::$key"
          echo "IDENTITY_KEY=$key" >> "$GITHUB_ENV"
          DATABASE_URL="$OWNER_DATABASE_URL" npm run -s identity:enforce -- on
          DATABASE_URL="$OWNER_DATABASE_URL" npm run -s identity:enforce -- server-scope off
          DATABASE_URL="$OWNER_DATABASE_URL" npm run -s identity:key -- status

      - name: The pooler - transaction mode, role, identity isolation under concurrency, latency
        run: |
          POOLED=$(npx neonctl connection-string "$BRANCH" --project-id "$PROJECT" --database-name neondb --role-name avela_runtime --pooled)
          echo "::add-mask::$POOLED"
          # What the pooled endpoint is: Neon's PgBouncer. These show the mode and that the runtime role is not an owner or bypass role.
          psql "$POOLED" -qAt -c "select 'pooled endpoint connects as ' || current_user" -c "select 'bypassrls=' || rolbypassrls || ' super=' || rolsuper from pg_roles where rolname = current_user" -c "show transaction_isolation"
          APP_DATABASE_URL="$POOLED" DATABASE_URL="$OWNER_DATABASE_URL" DB_ENFORCE_RLS=on POOLER_CHECK_ROUNDS=40 POOLER_CHECK_WIDTH=120 npm run -s pooler:check | tee pooler.txt
          grep -q "0 under the wrong identity" pooler.txt

      - name: Release verification and the restricted-role test suite on a scratch DATABASE inside the branch (named *_test, the suite's own guard)
        run: |
          psql "$OWNER_DATABASE_URL" -qAt -c "create database avela_ci_test"
          TESTURL=$(npx neonctl connection-string "$BRANCH" --project-id "$PROJECT" --database-name avela_ci_test)
          echo "::add-mask::$TESTURL"
          TEST_DATABASE_URL="$TESTURL" npm run -s test:rls 2>&1 | tail -8

      - name: Roll the branch back, newest first, and compare with the baseline
        run: |
          for f in 0029_narrow_server_scope 0028_scoped_system_identity 0027_connection_end_semantics 0026_private_account_columns 0025_verified_identity 0024_close_rls_gaps; do
            s=$(date +%s%N); psql "$OWNER_DATABASE_URL" -q -v ON_ERROR_STOP=1 -f "ops/rollback/$f.down.sql" > /dev/null; e=$(date +%s%N)
            echo "rollback $f: $(( (e - s) / 1000000 )) ms"
          done
          DATABASE_URL="$OWNER_DATABASE_URL" npm run -s schema:fingerprint > fp-after.txt
          diff -q fp-before.txt fp-after.txt && echo "structure restored exactly"

      - name: Delete the branch
        if: always()
        run: npx neonctl branches delete "$BRANCH" --project-id "$PROJECT" || true
