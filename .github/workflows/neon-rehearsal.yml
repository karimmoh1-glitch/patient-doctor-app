# The Neon safe-branch rehearsal (docs/RELEASE_PROCEDURE.md §1.3), run from GitHub's network because plain TCP to Neon is blocked from the owner's laptop.
#
# MANUAL ONLY, and it only appears in the Actions list (and `gh workflow run`) once this file is on the DEFAULT branch (main); GitHub does not register a
# dispatchable workflow from any other branch. The release candidate to rehearse is chosen with the `ref` input, so this file can stay small and reviewed
# on main while the candidate is a branch.
#
# It never touches production:
#   * it creates its own branch (a copy-on-write copy of the parent) and every database command uses THAT branch's connection strings;
#   * before anything else it checks the branch is not the project's primary/default branch and has a different endpoint host than the parent
#     (fail closed: if the API's answer does not say, it stops);
#   * the branch is deleted at the end whatever happens, and a failed delete is reported loudly with the branch name.
# The Neon API key is visible only to the steps that run neonctl, never to `npm ci` or the repository's scripts. The neonctl version is pinned.
# Every generated credential is masked and the workflow prints counts, timings and verdicts only. Failures fail the job (bash with pipefail).
#
# Owner setup (no secret is ever pasted into a chat; the values are read from your terminal):
#   gh secret set NEON_API_KEY      # Neon console > Account settings > API keys > create a key; paste when asked
#   gh variable set NEON_PROJECT_ID --body <the project id shown in the Neon console URL>
#   gh variable set NEON_PARENT_BRANCH --body <the name of the branch that holds the data to copy, usually main or production>
# Then: gh workflow run neon-rehearsal.yml --ref main -f ref=<release candidate branch or SHA> -f authorization='authorized: Neon rehearsal'
name: Neon rehearsal (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA of the release candidate to rehearse
        required: true
        default: mission2/close-security-gaps
      authorization:
        description: "Type exactly: authorized: Neon rehearsal"
        required: true
      database:
        description: Name of the database on the parent branch
        required: true
        default: neondb

permissions:
  contents: read

concurrency:
  group: neon-rehearsal
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # explicit shell = `bash -e -o pipefail`: a failure before a `| tail` is a failure of the step

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT: ${{ vars.NEON_PROJECT_ID }}
      PARENT: ${{ vars.NEON_PARENT_BRANCH }}
      BRANCH: rehearse-${{ github.run_id }}
      DBNAME: ${{ inputs.database }}
      NEONCTL: neonctl@8.9.0
    steps:
      - name: Authorization and configuration (before anything is created)
        env:
          AUTH: ${{ inputs.authorization }}
          REF: ${{ inputs.ref }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          [ "$AUTH" = "authorized: Neon rehearsal" ] || { echo "::error::the authorization input must be exactly: authorized: Neon rehearsal"; exit 1; }
          [ -n "$NEON_API_KEY" ] || { echo "::error::the NEON_API_KEY secret is not set (see the comment at the top of this file)"; exit 1; }
          [ -n "$PROJECT" ] || { echo "::error::the NEON_PROJECT_ID variable is not set"; exit 1; }
          [ -n "$PARENT" ] || { echo "::error::the NEON_PARENT_BRANCH variable is not set"; exit 1; }
          [[ "$DBNAME" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::the database input has characters that are not allowed"; exit 1; }
          # helpers for every later step: a millisecond timer, and a place to collect the summary
          cat > "$RUNNER_TEMP/lib.sh" <<'EOF'
          timed() { local label="$1"; shift; local s e rc; s=$(date +%s%N); "$@" && rc=0 || rc=$?; e=$(date +%s%N); echo "TIMING $label: $(( (e - s) / 1000000 )) ms (exit $rc)" >&2; { echo "- $label: $(( (e - s) / 1000000 )) ms"; } >> "$GITHUB_STEP_SUMMARY"; return $rc; }
          EOF
          echo "BASH_ENV=$RUNNER_TEMP/lib.sh" >> "$GITHUB_ENV"
          echo "## Neon rehearsal of \`$REF\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Record exactly which commit is being rehearsed
        run: |
          echo "commit: $(git rev-parse HEAD)"
          { echo "- commit \`$(git rev-parse HEAD)\`"; ls migrations | tail -6 | sed 's/^/- migration file: /'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the branch (a copy of the parent; nothing is written to the parent)
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          # From here on, whatever fails, the last step deletes the branch. Set the marker BEFORE creating so a half-created branch is cleaned up too.
          echo "BRANCH_CREATED=1" >> "$GITHUB_ENV"
          timed "branch creation" npx -y "$NEONCTL" branches create --name "$BRANCH" --parent "$PARENT" --project-id "$PROJECT" --output json > branch.json
          echo "branch id: $(jq -r '.branch.id' branch.json)"

      - name: Prove it is not the primary branch and does not share the parent's endpoint (fails closed)
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          npx -y "$NEONCTL" branches get "$BRANCH" --project-id "$PROJECT" --output json > branch-get.json
          # Require the API to SAY the branch is not the default; absence of the field is a failure, not a pass.
          jq -e '[.default, .primary, .branch.default, .branch.primary] | map(select(. != null)) | (length > 0 and all(. == false))' branch-get.json > /dev/null \
            || { echo "::error::could not establish that the rehearsal branch is not the project's default branch; stopping"; exit 1; }
          parent_host=$(npx -y "$NEONCTL" connection-string "$PARENT" --project-id "$PROJECT" --database-name "$DBNAME" | sed -E 's#.*@([^/:?]+).*#\1#')
          branch_host=$(npx -y "$NEONCTL" connection-string "$BRANCH" --project-id "$PROJECT" --database-name "$DBNAME" | sed -E 's#.*@([^/:?]+).*#\1#')
          [ -n "$parent_host" ] && [ -n "$branch_host" ] && [ "$parent_host" != "$branch_host" ] || { echo "::error::branch and parent share (or lack) an endpoint; stopping"; exit 1; }
          echo "branch is not the default branch, and its endpoint differs from the parent's"

      - name: Connection strings (masked)
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          OWNER=$(npx -y "$NEONCTL" connection-string "$BRANCH" --project-id "$PROJECT" --database-name "$DBNAME")
          echo "::add-mask::$OWNER"
          POOLED_OWNER=$(npx -y "$NEONCTL" connection-string "$BRANCH" --project-id "$PROJECT" --database-name "$DBNAME" --pooled)
          echo "::add-mask::$POOLED_OWNER"
          RUNTIME_PW=$(openssl rand -base64 36 | tr -d '\n=+/' | cut -c1-40)
          echo "::add-mask::$RUNTIME_PW"
          # The runtime role is created by SQL (db:create-app-role), so the Neon API does not know it: build its pooled URL from the pooled owner URL.
          POOLED=$(O="$POOLED_OWNER" P="$RUNTIME_PW" node -e 'const u=new URL(process.env.O);u.username="avela_runtime";u.password=process.env.P;process.stdout.write(u.toString())')
          echo "::add-mask::$POOLED"
          pooled_host=$(U="$POOLED" node -e 'process.stdout.write(new URL(process.env.U).hostname)')
          case "$pooled_host" in *-pooler*) echo "the runtime URL uses the provider's pooler host";; *) echo "::error::the runtime URL is not a pooler host; this would not rehearse the pooler"; exit 1;; esac
          { echo "OWNER_DATABASE_URL=$OWNER"; echo "AVELA_RUNTIME_PASSWORD=$RUNTIME_PW"; echo "POOLED_RUNTIME_URL=$POOLED"; } >> "$GITHUB_ENV"

      - name: Baseline - version, migrations, fingerprint
        run: |
          psql "$OWNER_DATABASE_URL" -qAt -c "select 'postgres ' || current_setting('server_version')" -c "select 'migrations applied ' || count(*) from schema_migrations" | tee -a "$GITHUB_STEP_SUMMARY"
          DATABASE_URL="$OWNER_DATABASE_URL" npm run -s schema:fingerprint | tee fp-before.txt | tail -1
          echo "expected fingerprint 5dc5a2698a1e if the parent is production before the release"

      - name: Dry run of every pending migration in one transaction (rolled back) - timed
        run: |
          timed "dry run (rolled back)" env OWNER_DATABASE_URL="$OWNER_DATABASE_URL" npm run -s migration:dry-run 2>&1 | tail -8

      - name: Apply for real on the branch - timed, with a lock watcher
        run: |
          ( while true; do psql "$OWNER_DATABASE_URL" -qAt -c "select count(*) from pg_locks where not granted" >> locks.txt 2>/dev/null; sleep 0.2; done ) &
          watcher=$!
          timed "migrations applied" env DATABASE_URL="$OWNER_DATABASE_URL" npm run -s db:migrate 2>&1 | tail -4
          kill "$watcher" || true
          echo "lock samples: $(wc -l < locks.txt), max waiting (ungranted) locks observed: $(sort -n locks.txt | tail -1)" | tee -a "$GITHUB_STEP_SUMMARY"
          DATABASE_URL="$OWNER_DATABASE_URL" npm run -s audit:db | tail -1

      - name: The runtime role, a fresh signing key, enforcement, and the unrestricted scope refused
        run: |
          DATABASE_URL="$OWNER_DATABASE_URL" npm run -s db:create-app-role | tail -2
          DATABASE_URL="$OWNER_DATABASE_URL" npm run -s identity:key -- generate --kid=rehearsal --out="$RUNNER_TEMP/identity.key" | tail -1
          key=$(grep '^IDENTITY_KEY=' "$RUNNER_TEMP/identity.key" | cut -d= -f2-)
          echo "::add-mask::$key"
          { echo "IDENTITY_KEY_ID=rehearsal"; echo "IDENTITY_KEY=$key"; } >> "$GITHUB_ENV"
          DATABASE_URL="$OWNER_DATABASE_URL" npm run -s identity:enforce -- on
          DATABASE_URL="$OWNER_DATABASE_URL" npm run -s identity:enforce -- server-scope off
          DATABASE_URL="$OWNER_DATABASE_URL" npm run -s identity:key -- status

      - name: The pooler - what the endpoint is, the role, identity isolation under concurrency, rollbacks, retries, latency
        run: |
          # What the pooled endpoint is: Neon's PgBouncer. These show that the runtime role connects through it and is not an owner or bypass role.
          psql "$POOLED_RUNTIME_URL" -qAt -c "select 'pooled endpoint connects as ' || current_user" -c "select 'bypassrls=' || rolbypassrls || ' super=' || rolsuper from pg_roles where rolname = current_user" | tee -a "$GITHUB_STEP_SUMMARY"
          # POOLER_CONTROL_REQUIRED: the run must also reproduce the old session-setting leak through this endpoint, or it would prove nothing about a pooler.
          APP_DATABASE_URL="$POOLED_RUNTIME_URL" DATABASE_URL="$OWNER_DATABASE_URL" DB_ENFORCE_RLS=on POOLER_CONTROL_REQUIRED=1 POOLER_CHECK_SERVER_SCOPE=refused POOLER_CHECK_ROUNDS=40 POOLER_CHECK_WIDTH=120 npm run -s pooler:check | tee pooler.txt
          grep -q "0 under the wrong identity" pooler.txt
          { echo '```'; tail -6 pooler.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: The restricted-role test suite on a scratch DATABASE inside the branch (named *_test, the suite's own guard)
        run: |
          psql "$OWNER_DATABASE_URL" -qAt -c "create database avela_ci_test"
          TESTURL=$(O="$OWNER_DATABASE_URL" node -e 'const u=new URL(process.env.O);u.pathname="/avela_ci_test";process.stdout.write(u.toString())')
          echo "::add-mask::$TESTURL"
          timed "test:rls on the branch (direct connection; the suite needs startup options a pooler refuses)" env TEST_DATABASE_URL="$TESTURL" npm run -s test:rls 2>&1 | tail -8

      - name: Roll the branch back, newest first, and compare with the baseline
        run: |
          for f in 0030_bind_acting_person 0029_narrow_server_scope 0028_scoped_system_identity 0027_connection_end_semantics 0026_private_account_columns 0025_verified_identity 0024_close_rls_gaps; do
            timed "rollback $f" psql "$OWNER_DATABASE_URL" -q -v ON_ERROR_STOP=1 -f "ops/rollback/$f.down.sql" > /dev/null
          done
          DATABASE_URL="$OWNER_DATABASE_URL" npm run -s schema:fingerprint > fp-after.txt
          if diff -q fp-before.txt fp-after.txt; then echo "structure restored exactly" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "::error::the rollback did not restore the baseline structure"; exit 1; fi

      - name: Delete the branch (always)
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          [ "${BRANCH_CREATED:-}" = "1" ] || { echo "no branch was created; nothing to delete"; exit 0; }
          if npx -y "$NEONCTL" branches delete "$BRANCH" --project-id "$PROJECT"; then
            echo "- branch $BRANCH deleted" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::could not delete branch $BRANCH (it may not have been created, or the delete failed). Check the Neon console and delete it by hand if it exists: it holds a copy of the parent's data."
            echo "- **branch $BRANCH may still exist: check the Neon console**" >> "$GITHUB_STEP_SUMMARY"
          fi
