name: Deliver reminders

# Vercel's free plan can only run a scheduled job once a day, which is too
# coarse for medication reminders. This workflow calls the reminder endpoint
# every five minutes instead. GitHub runs scheduled workflows on a best-effort
# basis, so a run can start a few minutes late; Avela's own status (in the app)
# only says reminders are "being sent" after a run has really happened.
#
# Set two repository secrets: AVELA_URL (e.g. https://avela-taupe.vercel.app)
# and CRON_SECRET (the same value as the CRON_SECRET environment variable on
# the host). Without them this workflow FAILS, so a missing secret is never a green tick.

on:
  schedule:
    # Off the :00/:05 marks, where GitHub's scheduler is busiest and most likely to delay or drop runs.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

# Two runs never overlap; the server also refuses to run the job twice at once.
concurrency:
  group: deliver-reminders
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AVELA_URL: ${{ secrets.AVELA_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Refuse to look healthy without configuration
        run: |
          if [ -z "$AVELA_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::AVELA_URL and CRON_SECRET repository secrets are required; no reminders were triggered."
            exit 1
          fi
      - name: Call the reminder endpoint
        run: |
          curl --fail --silent --show-error --max-time 45 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -H "X-Avela-Scheduler: github-actions" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${AVELA_URL%/}/api/cron/reminders"
